<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キマルマデ 採用ダッシュボード</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../assets/img/kimarumade-icon.png">
  <link rel="apple-touch-icon" href="../assets/img/kimarumade-icon.png">
  <meta name="theme-color" content="#14192E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #F6F4EE; }
    .app-frame { display: block; width: 100%; height: 100%; border: 0; }
    .fallback {
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      color: #5A6076;
      text-align: center;
      padding: 80px 24px;
      font-size: 14px;
      line-height: 2;
    }
  </style>
</head>
<body>
  <div id="mount" class="fallback">読み込み中です…</div>
  <script>
    (function () {
      var BASE = 'https://script.google.com/macros/s/AKfycbzAFmuz0uGpgnXt8n1IDd0PZKHYAoX6R3onaXEBDVzo-oIRT6gjqrBhtFfCPZrz1mj0/exec';
      var token = new URLSearchParams(location.search).get('token');
      var mount = document.getElementById('mount');
      if (!token) {
        mount.textContent = 'URLが正しくありません。担当者にお問い合わせください。';
        return;
      }
      var iframe = document.createElement('iframe');
      iframe.className = 'app-frame';
      iframe.src = BASE + '?token=' + encodeURIComponent(token);
      iframe.allow = 'clipboard-write';
      mount.replaceWith(iframe);
    })();
  </script>
</body>
</html>
