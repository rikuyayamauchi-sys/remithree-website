<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | Remi Three</title>
  <meta name="description" content="合同会社Remi Three - お問い合わせページ。採用支援・キャリア支援に関するご相談はこちらから。">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F4EE">
  <link rel="stylesheet" href="assets/style.css?v=20260829b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="assets/img/logo.png" alt="Remi Three" class="logo-img">
      </a>
      <button class="hamburger" id="hamburger" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">HOME</a>
        <div class="nav-item">
          <a href="service.html" class="nav-link">SERVICE</a>
          <div class="nav-drop">
            <a href="rpo/">キマルマデ<span class="drop-sub">地方企業専門・成果報酬型 採用代行</span></a>
          </div>
        </div>
        <a href="about.html" class="nav-link">ABOUT US</a>
        <a href="company.html" class="nav-link">COMPANY</a>
        <a href="contact.html" class="nav-link nav-link--cta active">CONTACT</a>
      </nav>
    </div>
  </header>

  <!-- Page Head -->
  <section class="page-head">
    <div class="container">
      <p class="page-en" aria-hidden="true">CONTACT</p>
      <h1 class="page-title">お問い合わせ</h1>
    </div>
  </section>

  <!-- Contact -->
  <section class="section section--navy" id="contact">
    <div class="container">
      <div class="contact-grid reveal">
        <div class="contact-info">
          <p class="contact-lead-title">まずは、お気軽に<br>ご相談ください。</p>
          <p class="contact-lead">
            採用に関するご相談、キャリア形成に関するご相談など、合同会社Remi Threeへのお問い合わせはこちらのフォームから承ります。
          </p>
          <div class="contact-email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <a href="mailto:info@remithree.com">info@remithree.com</a>
          </div>
        </div>
        <form class="contact-form" action="https://formspree.io/f/xqegrkvy" method="POST">
          <div class="form-row">
            <div class="form-group">
              <label for="company">会社名 <span class="required">*</span></label>
              <input type="text" id="company" name="company" required>
            </div>
            <div class="form-group">
              <label for="name">名前 <span class="required">*</span></label>
              <input type="text" id="name" name="name" required>
            </div>
          </div>
          <div class="form-group">
            <label for="email">メールアドレス <span class="required">*</span></label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label>問い合わせサービス</label>
            <div class="checkbox-group">
              <label class="checkbox"><input type="checkbox" name="service" value="キマルマデ（成果報酬型採用代行）"> キマルマデ（成果報酬型採用代行）</label>
              <label class="checkbox"><input type="checkbox" name="service" value="採用支援事業"> 採用支援事業</label>
              <label class="checkbox"><input type="checkbox" name="service" value="キャリア支援事業"> キャリア支援事業</label>
              <label class="checkbox"><input type="checkbox" name="service" value="楽曲制作"> 楽曲制作</label>
            </div>
          </div>
          <div class="form-group">
            <label for="message">メッセージ</label>
            <textarea id="message" name="message" rows="5"></textarea>
          </div>
          <button type="submit" class="form-btn">送信する</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-top">
        <img src="assets/img/logo-white.png" alt="Remi Three" class="footer-logo">
        <nav class="footer-nav">
          <a href="index.html">HOME</a>
          <a href="service.html">SERVICE</a>
          <a href="about.html">ABOUT US</a>
          <a href="company.html">COMPANY</a>
          <a href="contact.html">CONTACT</a>
          <a href="privacy.html">PRIVACY POLICY</a>
        </nav>
      </div>
    </div>
    <p class="footer-giant" aria-hidden="true">REMI THREE</p>
    <div class="footer-bottom">
      <p>&copy; 2024 Remi Three LLC. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('nav').classList.toggle('open');
      document.getElementById('hamburger').classList.toggle('open');
    });

    const onScroll = () => document.getElementById('header').classList.toggle('scrolled', window.scrollY > 30);
    window.addEventListener('scroll', onScroll);
    onScroll();

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
